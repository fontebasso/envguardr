name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version format: $VERSION"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag ($VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Build Docker image locally
        run: docker build --load -t envguardr:preflight .

      - name: Smoke test Docker image
        run: docker run --rm envguardr:preflight --help

      - name: Test Docker image with valid schema
        run: |
          mkdir -p /tmp/envguardr-smoke
          cat > /tmp/envguardr-smoke/env.schema.js <<'EOF'
          import { validators } from 'valitype'
          export default {
            API_URL: { type: 'url', required: true },
            PORT: { type: 'number', required: true },
            NODE_ENV: { type: { enum: ['development', 'production', 'test'] }, default: 'production' },
            API_KEY: {
              type: 'custom',
              validator: validators.regex(/^[A-Za-z0-9]{32}$/),
              required: true,
            },
          }
          EOF
          docker run --rm \
            -v /tmp/envguardr-smoke:/app:z \
            -e API_URL=https://example.com \
            -e PORT=3000 \
            -e NODE_ENV=production \
            -e API_KEY=0123456789abcdef0123456789abcdef \
            envguardr:preflight validate ./env.schema.js

      - name: Test Docker image with invalid schema
        run: |
          mkdir -p /tmp/envguardr-smoke-invalid
          cat > /tmp/envguardr-smoke-invalid/env.schema.js <<'EOF'
          export default {
            API_URL: { type: 'url', required: true },
            PORT: { type: 'number', required: true },
          }
          EOF
          set +e
          docker run --rm \
            -v /tmp/envguardr-smoke-invalid:/app:z \
            -e API_URL=not-a-url \
            -e PORT=abc \
            envguardr:preflight validate ./env.schema.js
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "Expected envguardr to fail with invalid environment variables"
            exit 1
          fi
          echo "Invalid environment test failed as expected"

  publish-npm:
    needs: preflight
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish with provenance and signature
        run: npm publish --access public

  publish-docker:
    needs: preflight
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/fontebasso/envguardr
            ghcr.io/fontebasso/envguardr
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Sign images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "docker.io/fontebasso/envguardr@${DIGEST}"
          cosign sign --yes "ghcr.io/fontebasso/envguardr@${DIGEST}"
