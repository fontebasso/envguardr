name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version format: $VERSION"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag ($VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Build Docker image locally
        run: docker build --load -t envguardr:preflight .

      - name: Smoke test Docker image
        run: docker run --rm envguardr:preflight --help

      - name: Check Docker image runs as non-root
        run: |
          USER_ID=$(docker image inspect --format '{{.Config.User}}' envguardr:preflight)
          case "$USER_ID" in
            ""|0|0:*|root|root:*)
              echo "Expected the image to run as a non-root user, got '$USER_ID'"
              exit 1
              ;;
          esac

      - name: Test Docker image with valid environment
        run: |
          mkdir -p /tmp/envguardr-smoke
          cat > /tmp/envguardr-smoke/env.schema.yaml <<'YAML'
          version: 1
          variables:
            API_URL:
              type: url
              required: true
            PORT:
              type: number
              required: true
            NODE_ENV:
              type: enum
              values: [development, production, test]
              default: production
            API_KEY:
              type: string
              required: true
          YAML
          docker run --rm \
            -v /tmp/envguardr-smoke:/app:z \
            -e API_URL=https://example.com \
            -e PORT=3000 \
            -e NODE_ENV=production \
            -e API_KEY=0123456789abcdef0123456789abcdef \
            envguardr:preflight validate ./env.schema.yaml

      - name: Test Docker image with invalid environment
        run: |
          set +e
          OUTPUT=$(docker run --rm \
            -v /tmp/envguardr-smoke:/app:z \
            -e API_URL=leak-check-url \
            -e PORT=leak-check-port \
            envguardr:preflight validate ./env.schema.yaml --format json 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 1 ]; then
            echo "Expected exit code 1 for an invalid environment, got $STATUS"
            exit 1
          fi
          if echo "$OUTPUT" | grep -q leak-check; then
            echo "Environment values leaked into the output"
            exit 1
          fi

      - name: Test Docker image with invalid schema
        run: |
          mkdir -p /tmp/envguardr-smoke-invalid
          printf 'version: 1\nvariables:\n  PORT:\n    type: number\n    requred: true\n' > /tmp/envguardr-smoke-invalid/env.schema.yaml
          set +e
          docker run --rm \
            -v /tmp/envguardr-smoke-invalid:/app:z \
            envguardr:preflight validate ./env.schema.yaml
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 2 ]; then
            echo "Expected exit code 2 for an invalid schema, got $STATUS"
            exit 1
          fi

  publish-npm:
    needs: preflight
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish with provenance and signature
        run: npm publish --access public

  publish-docker:
    needs: preflight
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/fontebasso/envguardr
            ghcr.io/fontebasso/envguardr
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Sign images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "docker.io/fontebasso/envguardr@${DIGEST}"
          cosign sign --yes "ghcr.io/fontebasso/envguardr@${DIGEST}"
